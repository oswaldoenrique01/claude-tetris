name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: claude-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: |
      github.event.issue.user.type != 'Bot' &&
      (github.event.action == 'opened' ||
       github.event.changes.title != null ||
       github.event.changes.body != null)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh api:*)"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}
            EVENTO: ${{ github.event.action }}

            Eres el triager de issues de este proyecto (Tetris en JavaScript vanilla + Canvas). Responde siempre en español.

            1. Lee el issue con `gh issue view ${{ github.event.issue.number }} --json title,body,labels,comments`.
               Lee `CLAUDE.md` y explora `game.js`, `index.html` y `style.css` para encontrar el código relacionado.

            2. LABELS
               - Obtén los labels válidos con `gh label list`. Usa SOLO labels que ya existan. Nunca crees labels.
               - Asigna exactamente un label de tipo (`bug`, `enhancement`, `documentation`, `question`, `duplicate`, `invalid`...),
                 al menos un `area:*` (`area:gameplay`, `area:ui`, `area:render`) y exactamente un `priority:*`.
               - Aplica con `gh issue edit ${{ github.event.issue.number }} --add-label "a,b,c"`.
               - Si el evento es `edited`, quita con `--remove-label` los labels `area:*`, `priority:*` y de tipo que tú pusiste antes y que ya no apliquen. No toques labels puestos manualmente por personas (p. ej. `good first issue`, `help wanted`, `wontfix`).

            3. DIAGNÓSTICO
               El comentario debe estar en Markdown de GitHub (GFM) y seguir EXACTAMENTE esta plantilla.
               La primera línea es el marcador (GitHub no lo muestra). Deja una línea en blanco entre bloques.
               Código con backticks y referencias `archivo:línea`. No uses HTML aparte de `<details>` y el marcador.

               <!-- claude-triage -->
               ## 🤖 Diagnóstico automático

               | Campo | Valor |
               | --- | --- |
               | Tipo | `bug` / `enhancement` / ... |
               | Área | `area:gameplay` / `area:ui` / `area:render` |
               | Prioridad | `priority:high` / `priority:medium` / `priority:low` |
               | Confianza | alta / media / baja |

               ### Resumen
               Una o dos frases.

               ### Causa probable
               Para un bug: la causa. Para una feature: la necesidad y su alcance.

               ### Código implicado
               - [`game.js:123`](https://github.com/${{ github.repository }}/blob/main/game.js#L123) `nombreFuncion`: qué hace aquí.

               ### Propuesta de solución
               1. Paso concreto.
               2. Paso concreto.

               ### Riesgos
               - Efecto secundario posible.

               ### Preguntas abiertas
               - [ ] Pregunta pendiente (omite la sección si no hay).

               <details>
               <summary>Cómo reproducir / verificar</summary>

               Pasos para comprobar el arreglo en el navegador.

               </details>

               Los valores de la tabla deben coincidir con los labels que aplicaste en el paso 2.
               Este diagnóstico lo usará el equipo para implementar la solución: sé específico y verificable.

            4. UN SOLO COMENTARIO
               Pasa el cuerpo con un heredoc de delimitador entrecomillado (`<<'EOF'`) para que saltos de línea,
               backticks y comillas lleguen intactos. Nunca metas el cuerpo entre comillas simples o dobles en una sola línea.
               - Busca el comentario existente:
                 `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments --paginate --jq '.[] | select(.body | startswith("<!-- claude-triage -->")) | .id'`
               - Si devuelve un ID, actualízalo:
                 `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<ID> -f body="$(cat <<'EOF'`
                 `...diagnóstico...`
                 `EOF`
                 `)"`
               - Si no devuelve nada, créalo:
                 `gh issue comment ${{ github.event.issue.number }} --body "$(cat <<'EOF'`
                 `...diagnóstico...`
                 `EOF`
                 `)"`

            5. No modifiques código, no cierres el issue, no hagas commits.
