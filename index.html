<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">SKIN</span>
          <div class="skins">
            <button data-skin-btn="retro">Retro</button>
            <button data-skin-btn="neon">Neon</button>
            <button data-skin-btn="pastel">Pastel</button>
            <button data-skin-btn="pixel">Pixel</button>
          </div>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="overlay-msg" class="hidden"></p>

        <form id="name-form" class="hidden">
          <input id="name-input" type="text" maxlength="10" placeholder="Tu nombre" autocomplete="off" />
          <button type="submit" id="save-btn">Guardar</button>
        </form>

        <div id="records" class="hidden">
          <span class="label">TOP 5</span>
          <ol id="records-list"></ol>
          <p id="records-stats"></p>
          <button id="reset-btn" type="button">Resetear records</button>
        </div>

        <button id="restart-btn">Jugar</button>
      </div>
    </div>
    <div id="pause-menu" class="overlay hidden">
      <div class="overlay-box menu-box">
        <div id="menu-main" class="menu-view">
          <p class="menu-title">PAUSA</p>
          <button class="menu-btn" id="resume-btn">Reanudar</button>
          <button class="menu-btn" id="menu-restart-btn">Reiniciar</button>
          <button class="menu-btn" id="controls-btn">Ver controles</button>
          <div class="menu-level">
            <span class="label">NIVEL INICIAL</span>
            <div class="level-picker">
              <button class="menu-btn small" id="level-down" aria-label="Bajar nivel">−</button>
              <span id="start-level" class="value">1</span>
              <button class="menu-btn small" id="level-up" aria-label="Subir nivel">+</button>
            </div>
            <span class="hint">Se aplica al reiniciar</span>
          </div>
        </div>

        <div id="menu-controls" class="menu-view hidden">
          <p class="menu-title">CONTROLES</p>
          <ul class="menu-keys">
            <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
            <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
            <li><span><kbd>↓</kbd></span> bajar</li>
            <li><span><kbd>Space</kbd></span> caída</li>
            <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa</li>
          </ul>
          <button class="menu-btn" id="back-btn">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
